name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test with coverage (unit, engine, integration)
        run: dart run coverage:test_with_coverage
      - name: Enforce 90% line coverage on lib/src
        run: dart run tool/check_coverage.dart 90

  web:
    name: Web smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test -p chrome test/web

  flutter_example:
    name: Flutter example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/flutter_chat
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  publish_dry_run:
    name: Publish dry run and pana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
      # pana's sandbox does not support Windows paths, so the score is
      # checked here. Informational for now; once the baseline is known,
      # add --exit-code-threshold to fail on lost points.
      - run: dart pub global activate pana
      - run: dart pub global run pana --no-warning .
