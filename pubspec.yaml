name: typed_socket
description: >-
  A typed, resilient WebSocket client for Dart and Flutter: automatic
  reconnect with jittered backoff, heartbeats, offline buffering, and typed
  JSON channels.
version: 0.1.0
topics:
  - websocket
  - realtime
  - networking
  - reconnect

environment:
  sdk: ^3.5.0

dependencies:
  meta: ^1.15.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  coverage: ^1.15.1
  fake_async: ^1.3.3
  lints: ^6.1.0
  test: ^1.32.0
